name: Branding text audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tracked text, filenames and audit self-tests
        run: python3 tools/check_branding.py
      - name: Check packaging and audit script syntax
        run: python3 -m py_compile tools/check_branding.py tools/build_release.py
      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code
