name: Windows release

on:
  push:
    branches: [main]
    paths:
      - project.godot
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Determine release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content project.godot -Raw), 'config/version="([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing project version' }
          "number=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "v$version is already published; leaving its assets unchanged."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0
      - name: Install verified Godot 4.6.3 editor and templates
        if: steps.version.outputs.exists == 'false'
        run: python tools/install_ci_godot.py
      - name: Run all regression and multiplayer checks
        if: steps.version.outputs.exists == 'false'
        run: python tools/run_checks.py
      - name: Export, smoke-test and package Windows x64
        if: steps.version.outputs.exists == 'false'
        run: python tools/build_release.py --output "$env:RUNNER_TEMP/release"
      - name: Publish versioned Windows download
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $archive = "$env:RUNNER_TEMP/release/Downstack_Windows_$env:RELEASE_VERSION.zip"
          gh release create "v$env:RELEASE_VERSION" $archive "$archive.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Downstack $env:RELEASE_VERSION" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
