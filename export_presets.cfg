[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="windows/*.ps1"
exclude_filter="tests/*,tools/*,README.md,VALIDATION.md,CHANGELOG.md,RULES_REFERENCE.md,SOFT_DROP_REFERENCE.md,INPUT_AUDIT.md,BUFFER_NOTES.md,GITHUB_SETUP.md"
export_path="../build/Downstack.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/icon="res://assets/icon.png"
application/product_name="Downstack"
application/file_description="Downstack falling-block game"
application/file_version="0.8.0.0"
application/product_version="0.8.0.0"

[preset.1]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="windows/*.ps1"
exclude_filter="tests/*,tools/*,README.md,VALIDATION.md,CHANGELOG.md,RULES_REFERENCE.md,SOFT_DROP_REFERENCE.md,INPUT_AUDIT.md,BUFFER_NOTES.md,GITHUB_SETUP.md"
export_path="../build/Downstack.x86_64"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
